services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - quarantine_volume:/var/app/quarantine
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ec2_network

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nas_user} -d ${POSTGRES_DB:-nas_ec2}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ec2_network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - ec2_network

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - ec2_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  quarantine_volume:

networks:
  ec2_network:
    driver: bridge
